<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Icône d'ALmaze : un labyrinthe et le chemin qui mène à son centre. Source de source.png
       (voir docs/INSTALLATION.md, « Icône »). -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a" />
      <stop offset="0.55" stop-color="#0f6cbd" />
      <stop offset="1" stop-color="#0891b2" />
    </linearGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="halo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="flou" />
      <feMerge>
        <feMergeNode in="flou" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="ombre" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1730" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#fond)" filter="url(#ombre)" />
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#reflet)" />

  <!-- Murs. -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.93" stroke-width="58" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 340 V824 H824 V200 H200" />
    <path d="M584 704 H320 V320 H704 V704" />
    <path d="M440 584 V440 H584" />
    <path d="M512 200 V320" />
    <path d="M824 512 H704" />
  </g>

  <!-- Chemin : entrée à gauche, entre les murs, jusqu'au centre. -->
  <g filter="url(#halo)">
    <path d="M110 270 H260 V764 H644 V512 H520" fill="none" stroke="#fbbf24" stroke-width="40"
      stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="512" cy="512" r="38" fill="#fbbf24" />
  </g>
  <circle cx="512" cy="512" r="15" fill="#fff7d6" />
</svg>
